services:
  - type: web
    name: campus360
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: CAMPUS360_SECRET_KEY
        generateValue: true
      - key: CAMPUS360_OWNER_EMAIL
        sync: false
      - key: CAMPUS360_OWNER_SETUP_TOKEN
        generateValue: true
